name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI smoke test (non-interactive)
        run: |
          excel2sql --version
          excel2sql examples/superstore-sample.csv -o build/sample.sql -d sqlserver
          excel2sql examples/superstore-sample.csv -o build/sample-insert.sql --format insert -d mysql
          excel2sql examples/superstore-sample.csv -o build/sample-ora.sql -d oracle

      - name: Show generated head
        run: |
          python -c "print(''.join(open('build/sample.sql', encoding='utf-8').readlines()[:8]))"
