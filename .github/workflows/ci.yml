name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI smoke test (non-interactive)
        run: |
          excel2sql --version
          excel2sql examples/superstore-sample.csv -o build/sample.sql -d sqlserver
          excel2sql examples/superstore-sample.csv -o build/sample-insert.sql --format insert -d mysql
          excel2sql examples/superstore-sample.csv -o build/sample-ora.sql -d oracle

      - name: Show generated head
        # Windows 上 stdout 走管道时用的是 ANSI 码页（en-US runner 即 cp1252），
        # 直接 print 含中文的 SQL 会抛 UnicodeEncodeError 让步骤红 ——
        # 这一步纯粹是给人看的演示，显式指定 UTF-8。
        # 注意：不要提到 job 级别，否则会掩盖工具自身在 Windows 管道下的编码问题
        # （那个由 excel2sql 的 cli.setup_console() + TestConsoleEncoding 负责）。
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "print(''.join(open('build/sample.sql', encoding='utf-8').readlines()[:8]))"
